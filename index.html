<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>할 일</h1>
      <p class="summary" id="summary" aria-live="polite"></p>
    </header>

    <form class="new-todo" id="new-todo-form" autocomplete="off">
      <label class="visually-hidden" for="new-todo-input">새 할 일</label>
      <input id="new-todo-input" type="text" placeholder="할 일을 입력하고 Enter" maxlength="200" required>
      <button type="submit">추가</button>
    </form>

    <nav class="filters" aria-label="필터">
      <button type="button" data-filter="all" aria-pressed="true">전체</button>
      <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
      <button type="button" data-filter="completed" aria-pressed="false">완료</button>
    </nav>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty" id="empty-message" hidden></p>

    <footer class="app-footer">
      <button type="button" id="toggle-all">모두 완료</button>
      <button type="button" id="clear-completed">완료 항목 삭제</button>
    </footer>

    <p class="hint">항목을 더블클릭하면 수정할 수 있습니다. 수정 중 Enter로 저장, Esc로 취소.</p>
  </main>

  <script src="todo.js"></script>
  <script src="app.js"></script>
</body>
</html>
